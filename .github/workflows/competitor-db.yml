name: competitor db 競合全動画DB

# 横断分析の「分母」を貯める (正本: private repo の docs/competitor_db.md)。
#   refresh … 毎日 RSS で新着だけ追記 (quota ~0)
#   backfill … 全アップロード履歴の初回ダンプ。quota を食う (1ch~8u・全体~16k u) ので
#              手動実行のみ。budget を入力して数日に分けて進める (レジューム可)。
# 生成物はこの repo の corpus/ に commit する (2026-10-27〜。以前は別 repo youtube-niche-corpus 前提)。

on:
  schedule:
    # UTC 20:33 = JST 05:33。rss-patrol(05:03) の後・priority(0/6/12/18)と非衝突。
    - cron: "33 20 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "全履歴バックフィルも走らせる (quota 消費)"
        type: boolean
        default: false
      budget:
        description: "backfill の quota 上限 (units)"
        default: "3000"

concurrency:
  group: competitor-db
  cancel-in-progress: false

env:
  CORPUS_DIR: ${{ github.workspace }}/corpus

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: refresh (RSS・quota 0)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          mkdir -p "$CORPUS_DIR"
          python competitor_db.py refresh | tee -a run.log

      - name: backfill (手動 & budget 内・レジューム)
        if: github.event.inputs.backfill == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CDB_BUDGET: ${{ github.event.inputs.budget }}
        run: python competitor_db.py backfill --budget "$CDB_BUDGET" | tee -a run.log

      - name: commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corpus/
          if [ -f time_series/quota_log.jsonl ]; then git add time_series/quota_log.jsonl; fi
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "cdb(auto): $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git pull --rebase --autostash origin main && git push && break; sleep 5; done
          fi
