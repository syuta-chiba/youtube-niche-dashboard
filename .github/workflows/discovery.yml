name: discovery loop 当たり企画発掘

# ★ 2026-10-28 private repo (youtube-niche-research) から移設 (priority-channels.yml 冒頭の説明を参照)。

on:
  schedule:
    # UTC 19:23 = JST 04:23 (1 日 1 回)。priority-channels の 0/6/12/18 と被らない時刻。
    # 2026-10-26〜30 は広告判定に quota を回すため停止していた → 2026-10-30 再開
    - cron: "23 19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "分析のみ (priority/ledger を書き換えない)"
        type: boolean
        default: false
      promote:
        description: "AUTO 追加を有効にする (既定は確認制: 全候補 queue 止まり)"
        type: boolean
        default: false

concurrency:
  group: discovery-loop
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: syuta-chiba/youtube-niche-research
          ssh-key: ${{ secrets.PRIVATE_REPO_SSH_KEY }}
          path: src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - run: pip install -q -r src/requirements.txt

      - name: discovery_loop.py 実行 (出力は run.log へ・public ログには件数のみ)
        id: run
        working-directory: src
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          # 2026-07-21 から確認制: priority_channels.txt への追加は必ず人間レビューを通す。
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          if [ "${{ inputs.promote }}" != "true" ]; then FLAGS="$FLAGS --no-promote"; fi
          set +e
          python discovery_loop.py $FLAGS > run.log 2>&1
          rc=$?
          set -e
          summary=$(grep "^DISCOVERY_SUMMARY|" run.log | tail -1 || true)
          echo "summary=$summary" >> $GITHUB_OUTPUT
          echo "$summary"
          if [ "$rc" != "0" ]; then echo "::error::discovery_loop.py exit=$rc (詳細は Slack)"; exit $rc; fi

      # 新しく入ったコーパス行に軸内/軸外ラベルを付ける（決定論のみ・claude 不要）
      - name: corpus_filter.py (決定論パス)
        if: always()
        working-directory: src
        run: python corpus_filter.py >> run.log 2>&1 || true

      - name: Slack 通知 (追加 or queue があった時のみ)
        working-directory: src
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          summary="${{ steps.run.outputs.summary }}"
          if echo "$summary" | grep -q "promoted=0|queued=0"; then
            echo "通知なし (変化なし)"; exit 0
          fi
          promoted_lines=$(grep "^PROMOTED|" run.log || true)
          body=":satellite: discovery loop\n$summary"
          if [ -n "$promoted_lines" ]; then
            while IFS='|' read -r _tag cid title subs hit timing; do
              body="$body\n• 追加: $title ($subs subs / $hit / $timing)"
            done <<< "$promoted_lines"
          fi
          state=$(python state_summary.py --slack)
          body="$body"$'\n\n'"$state"
          payload=$(jq -nc --arg t "$body" '{text: $t}')
          curl -sS -o /dev/null -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL" || true

      - name: 変更を private repo に commit & push
        if: ${{ inputs.dry_run != true }}
        working-directory: src
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add priority_channels.txt discovery_seen.json discovery_queue.md discovery_reports/ || true
          if [ -f time_series/external_hits.jsonl ]; then git add time_series/external_hits.jsonl; fi
          if [ -d time_series/external_hits_archive ]; then git add time_series/external_hits_archive/; fi
          if [ -f time_series/quota_log.jsonl ]; then git add time_series/quota_log.jsonl; fi
          if [ -f rss_pool.json ]; then git add rss_pool.json; fi
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -q -m "discovery(auto): 当たり企画発掘 $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              git pull -q --rebase --autostash origin main && git push -q && break
              echo "push retry $i"; sleep 5
            done
          fi

      - name: 失敗時は Slack に run.log 末尾を送る (public ログには出さない)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$SLACK_WEBHOOK_URL" ] || { echo "SLACK_WEBHOOK_URL 未設定のため通知スキップ"; exit 0; }
          tail -c 2500 src/run.log > tail.txt 2>/dev/null || echo "(run.log なし)" > tail.txt
          payload=$(jq -nc --rawfile t tail.txt --arg u "$RUN_URL" \
            '{text: ("🔥 *discovery loop 失敗* (public runner)\n<" + $u + "|run を見る>\n```" + $t + "```")}')
          curl -sS -o /dev/null -H 'Content-Type: application/json' -d "$payload" "$SLACK_WEBHOOK_URL"
